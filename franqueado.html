<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seja franqueado — 40 Sabores</title><meta name="description" content="Quer ter uma 40 Sabores? Deixe seus dados e a rede entra em contato pelo WhatsApp.">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css"></head><body>
<main><section><div class="wrap"><h1 class="tit">Seja franqueado</h1><p class="sub">A 40 Sabores tem mais de 80 franquias no Brasil. Conte um pouco sobre você e a rede entra em contato pelo WhatsApp.</p>
<form id="f" novalidate>
 <label>Seu nome<input id="nome" autocomplete="name" required></label>
 <label>WhatsApp (com DDD)<input id="tel" inputmode="tel" autocomplete="tel" placeholder="(27) 99999-9999" required></label>
 <label>Cidade e estado onde quer abrir<input id="cid" placeholder="Ex.: Vitória, ES" required></label>
 <label>Já tem um ponto ou imóvel em vista?<select id="ponto"><option>Ainda não</option><option>Sim, já tenho</option><option>Estou procurando</option></select></label>
 <label>Mensagem (opcional)<textarea id="msg" rows="3"></textarea></label>
 <button class="btn b1" type="submit">Enviar pelo WhatsApp</button>
 <p class="ps" id="erro" hidden style="color:#b00020">Preencha nome, WhatsApp e cidade.</p>
 <p class="ps">Ao enviar, o WhatsApp abre com a mensagem pronta para a rede. Nada é enviado antes de você tocar em enviar lá.</p>
</form></div></section></main>
<script src="comum.js"></script><script>
montarLayout("franq");
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();
 const v=id=>document.getElementById(id).value.trim();
 if(!v("nome")||!v("tel")||!v("cid")){document.getElementById("erro").hidden=false;return;}
 document.getElementById("erro").hidden=true;
 const t=`Olá, 40 Sabores! Tenho interesse em ser franqueado.\n\nNome: ${v("nome")}\nWhatsApp: ${v("tel")}\nCidade/UF: ${v("cid")}\nPonto/imóvel: ${v("ponto")}`+(v("msg")?`\nMensagem: ${v("msg")}`:"");
 window.open(zap(WHATSAPP_REDE,t),"_blank","noopener");});
</script></body></html>
