<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lojas — 40 Sabores</title><meta name="description" content="Encontre a 40 Sabores mais perto de você: endereço, WhatsApp e Instagram.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css?v=3"></head><body>
<main><section class="topo-pg"><div class="wrap"><h1>Encontre sua 40 Sabores.</h1><p>Escolha a cidade e fale direto com a loja.</p></div></section>
<div class="barra"><div class="wrap" style="padding-top:1.4rem"><form class="busca" onsubmit="return false" role="search"><label class="sr" for="q">Buscar cidade</label><input id="q" type="search" placeholder="Digite sua cidade" autocomplete="off"></form></div></div>
<div class="wrap"><div class="lojas" id="lista"></div><p class="vazio" id="vazio" hidden>Nenhuma loja encontrada. Tente outra cidade ou fale com a rede pelo WhatsApp.</p>
<p class="nota">Lista em construção. Endereços e telefones serão confirmados com cada unidade.</p></div></main>
<script src="comum.js?v=3"></script><script>
montarLayout("lojas");
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const q0=new URLSearchParams(location.search).get("q")||"";document.getElementById("q").value=q0;
function desenhar(){const q=norm(document.getElementById("q").value.trim());
 const l=LOJAS.filter(x=>!q||norm(x.cidade+" "+x.nome+" "+x.end).includes(q));
 document.getElementById("lista").innerHTML=l.map(x=>`<article class="loja"><span class="cid">${x.cidade}</span><h3>${x.nome}</h3><p>${x.end}</p>${x.tag?`<span class="tag">${x.tag}</span>`:""}
 <div class="ac">${x.zap?`<a class="btn b-zap" target="_blank" rel="noopener" href="${zap(x.zap,"Olá, "+x.nome+"! Vim pelo site.")}">WhatsApp da loja</a>`:`<a class="btn b-zap" target="_blank" rel="noopener" href="${zap(WHATSAPP_REDE,"Olá! Gostaria de falar com a loja "+x.nome+".")}">Falar pela rede</a>`}<a class="btn b-lin" target="_blank" rel="noopener" href="https://www.instagram.com/${x.insta}/">Instagram</a></div></article>`).join("");
 document.getElementById("vazio").hidden=l.length>0;}
document.getElementById("q").addEventListener("input",desenhar);desenhar();
</script></body></html>
